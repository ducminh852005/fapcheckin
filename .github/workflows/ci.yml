name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  firebase:
    name: Security Rules, Functions, e2e (Firebase Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install dependencies
        run: |
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
          npm ci --prefix e2e_test
      - name: Rules unit tests (Firestore + Storage)
        run: npm test --prefix firebase
      - name: Cloud Functions unit tests
        run: npm test --prefix firebase/functions
      - name: End-to-end flow
        run: npm test --prefix e2e_test

  flutter-core:
    name: packages/core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-mobile:
    name: mobile
    runs-on: ubuntu-latest
    # Còn 2 test thất bại từ trước khi chuyển sang Firebase (api_models_test: thứ tự dashboard;
    # create_class_dialog_test: tràn layout) — xem docs/quick-start-mobile.md. Bỏ continue-on-error khi đã sửa.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
