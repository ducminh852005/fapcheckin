name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  # Được deploy.yml gọi lại: chỉ deploy khi toàn bộ test xanh.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_TOOLS_VERSION: '15'

jobs:
  firebase:
    name: Rules, Functions, e2e (Firebase Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
            e2e_test/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-

      - name: Install firebase-tools
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
          npm ci --prefix e2e_test

      - name: Validate Firebase config files
        run: |
          for f in firebase.json firebase/firestore.indexes.json firebase/remoteconfig.template.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done

      - name: Rules unit tests (Firestore + Storage)
        run: npm test --prefix firebase

      - name: Cloud Functions unit tests
        run: npm test --prefix firebase/functions

      - name: End-to-end flow
        run: npm test --prefix e2e_test

      - name: Syntax check student check-in page
        run: |
          cp web/checkin/app.js "$RUNNER_TEMP/checkin-app.mjs"
          node --check "$RUNNER_TEMP/checkin-app.mjs"

  flutter-core:
    name: packages/core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Còn 2 test thất bại từ trước khi chuyển sang Firebase (api_models_test: thứ tự dashboard;
    # create_class_dialog_test: tràn layout) — xem docs/quick-start-mobile.md §7.
    # Bỏ continue-on-error khi đã sửa.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
