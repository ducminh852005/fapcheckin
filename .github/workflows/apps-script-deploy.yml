name: Deploy Apps Script

on:
  push:
    branches:
      - main
      - backend-data
      - khoa-le
    paths:
      - 'apps-script/**' # Chỉ trigger khi code trong thư mục apps-script thay đổi
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp@2

      - name: Setup Clasp Auth
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          echo "$CLASP_TOKEN" > ~/.clasprc.json

      - name: Setup .clasp.json
        working-directory: apps-script
        run: |
          # Tao .clasp.json tu clasp.json (dung cp -f de ghi de neu da ton tai)
          cp -f clasp.json .clasp.json

      - name: Validate Apps Script
        run: node --test apps-script/tests/*.test.cjs

      - name: Push and Deploy to Apps Script
        working-directory: apps-script
        run: |
          # 1. Push code lên (lưu file)
          clasp push -f
          
          # 2. Tạo phiên bản mới và tự động cập nhật URL Web App hiện tại
          clasp deploy -i AKfycbwhbrv6Y76dGETuwDeMqObH1Dvf9RwQ5obDkxuuR-x5m2T3JoCByY0EuuB4ptuTHC3cwA -d "Auto-deployed via Github Actions"
