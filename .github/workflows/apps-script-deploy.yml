name: Deploy Apps Script

on:
  push:
    branches:
      - main
      # - backend-data
      # - khoa-le
      # - feature/report
    paths:
      - 'apps-script/**' # Chỉ trigger khi code trong thư mục apps-script thay đổi
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp@2

      - name: Setup Clasp Auth
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          echo "$CLASP_TOKEN" > ~/.clasprc.json

      - name: Setup .clasp.json
        working-directory: apps-script
        run: |
          # Tao .clasp.json tu clasp.json (dung cp -f de ghi de neu da ton tai)
          cp -f clasp.json .clasp.json

      - name: Validate Apps Script
        run: node --test apps-script/tests/*.test.cjs

      - name: Verify report action is included
        working-directory: apps-script
        run: |
          test -f ReportService.gs
          grep -F "'getReport'" Router.gs

      - name: Push and Deploy to Apps Script
        working-directory: apps-script
        run: |
          # 1. Push code lên (lưu file)
          clasp push -f
          
          # 2. Tạo phiên bản mới và tự động cập nhật URL Web App hiện tại
          clasp deploy -i AKfycbwhbrv6Y76dGETuwDeMqObH1Dvf9RwQ5obDkxuuR-x5m2T3JoCByY0EuuB4ptuTHC3cwA -d "Auto-deployed via Github Actions"

      - name: Verify live web app revision
        env:
          WEB_APP_URL: https://script.google.com/macros/s/AKfycbwhbrv6Y76dGETuwDeMqObH1Dvf9RwQ5obDkxuuR-x5m2T3JoCByY0EuuB4ptuTHC3cwA/exec
          EXPECTED_REVISION: 2026-09-25-timetable-ocr-v4
        run: |
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error --location "$WEB_APP_URL?action=getBackendInfo" || true)"
            if LIVE_RESPONSE="$response" node -e "const body = JSON.parse(process.env.LIVE_RESPONSE); if (!body.success || body.data.revision !== process.env.EXPECTED_REVISION) process.exit(1)"; then
              echo "Verified live Apps Script revision: $EXPECTED_REVISION"
              exit 0
            fi
            echo "Live deployment not updated yet (attempt $attempt/6)."
            sleep 10
          done
          echo "The deployment URL is still serving an old Apps Script version."
          exit 1
