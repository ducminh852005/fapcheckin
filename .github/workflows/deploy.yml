name: Deploy Firebase

# CD: chạy sau khi workflow "CI" của lần push lên main kết thúc THÀNH CÔNG (test xanh mới deploy).
# Thiết lập một lần: docs/deploy-firebase.md §10.
#   Secret   FIREBASE_SERVICE_ACCOUNT : JSON khóa service account (vai trò Firebase Admin) — KHÔNG commit
#   Variable FIREBASE_PROJECT_ID      : mặc định fapcheckin-3bn2di
#   Variable FIREBASE_DEPLOY_TARGETS  : mặc định "firestore,hosting"; thêm storage, remoteconfig, functions
#                                       khi đã bật (Storage; Functions cần gói Blaze + Cloud Vision API)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Không hủy deploy đang chạy giữa chừng.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cấu hình Required reviewers cho environment "production" nếu muốn duyệt tay trước khi deploy.
    environment: production
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'fapcheckin-3bn2di' }}
      TARGETS: ${{ vars.FIREBASE_DEPLOY_TARGETS || 'firestore,hosting' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Kiểm tra secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT (xem docs/deploy-firebase.md §10)."
            exit 1
          fi
          echo "Project: $PROJECT_ID — Targets: $TARGETS"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Đăng nhập Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Install Functions dependencies
        if: contains(env.TARGETS, 'functions')
        run: npm ci --prefix firebase/functions

      - name: Deploy
        run: firebase deploy --only "$TARGETS" --project "$PROJECT_ID" --non-interactive

      - name: Tóm tắt
        run: |
          {
            echo "### Deploy Firebase"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Project: \`$PROJECT_ID\`"
            echo "- Targets: \`$TARGETS\`"
            echo "- Trang SV: https://$PROJECT_ID.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
