name: Preview check-in page

# Mỗi PR sửa trang SV được deploy lên một preview channel (hết hạn sau 7 ngày) để xem thử.
# Dùng chung secret FIREBASE_SERVICE_ACCOUNT với deploy.yml; PR từ fork không có secret nên bị bỏ qua.

on:
  pull_request:
    paths:
      - 'web/checkin/**'
      - 'firebase.json'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'fapcheckin-3bn2di' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npm install -g firebase-tools@15

      - name: Deploy preview channel
        id: deploy
        run: |
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project "$PROJECT_ID" --expires 7d --non-interactive --json > preview.json
          echo "url=$(node -e "const j=require('./preview.json');const s=Object.values(j.result)[0];console.log(s.url)")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview trang check-in: ${{ steps.deploy.outputs.url }}\n(hết hạn sau 7 ngày; thêm \`?emulator=1\` chỉ dùng được trên localhost)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
