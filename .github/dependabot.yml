version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: npm
    directories: [/firebase, /firebase/functions, /e2e_test]
    schedule: { interval: monthly }
    groups:
      firebase-js: { patterns: ['firebase*', '@firebase/*', '@google-cloud/*'] }

  - package-ecosystem: pub
    directories: [/packages/core, /mobile]
    schedule: { interval: monthly }
    # Gói Firebase của FlutterFire phải nâng cùng nhau.
    groups:
      flutterfire: { patterns: ['firebase_*', 'cloud_firestore', 'cloud_functions'] }
